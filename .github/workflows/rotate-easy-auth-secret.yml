name: Rotate Easy Auth client secret

# Runs twice a year (on the 1st of every 6th month at 02:00 UTC) and
# on-demand via workflow_dispatch. Rotates the Easy Auth client secret
# on the Library-Patrons app registration and writes the new value to
# Key Vault. App Service picks it up via the KV reference within ~24h.
#
# The booktracker-ci OIDC service principal does the work — it must have
# been granted Application.ReadWrite.OwnedBy (Graph) + owner of the
# Library-Patrons app registration + the right to write a secret through
# Azure Resource Manager (Contributor on the resource group; the vault's own
# endpoint is closed to public networks, so the script never uses it). infra/setup-github-oidc.ps1 is the canonical place that grants
# all three; re-run it if permissions drift.

on:
  schedule:
    - cron: '0 2 1 */6 *'  # 02:00 UTC, 1st of every 6th month
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: rotate-easy-auth
  cancel-in-progress: false

env:
  APP_REG_NAME: Library-Patrons
  # Exact module versions (security sweep LIB-008). These modules run with the CI identity's
  # token, so the job must never pick up whatever the gallery published most recently. Nothing
  # bumps these automatically: to move one, look the version up on powershellgallery.com,
  # change it here in a pull request, and run this workflow once by hand afterwards.
  # Each Graph module must match the other exactly; Az.KeyVault needs Az.Accounts at or above
  # the version it declares.
  AZ_ACCOUNTS_VERSION: '5.5.4'
  AZ_KEYVAULT_VERSION: '6.6.2'
  MG_AUTHENTICATION_VERSION: '2.41.2'
  MG_APPLICATIONS_VERSION: '2.41.2'

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PowerShell modules (pinned versions)
        # Before the Azure sign-in, dependencies first, each at its exact version.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pinned = [ordered]@{
            'Az.Accounts'                    = $env:AZ_ACCOUNTS_VERSION
            'Az.KeyVault'                    = $env:AZ_KEYVAULT_VERSION
            'Microsoft.Graph.Authentication' = $env:MG_AUTHENTICATION_VERSION
            'Microsoft.Graph.Applications'   = $env:MG_APPLICATIONS_VERSION
          }
          foreach ($m in $pinned.GetEnumerator()) {
            Install-Module $m.Key -RequiredVersion $m.Value -Force -Scope CurrentUser -AllowClobber -Repository PSGallery
            if (-not (Get-Module -ListAvailable -Name $m.Key | Where-Object { $_.Version -eq [version]$m.Value })) {
              throw "$($m.Key) $($m.Value) is not installed"
            }
            "$($m.Key) $($m.Value) installed"
          }

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          # The rotation script uses Azure PowerShell (Get-AzKeyVault, Invoke-AzRestMethod) as
          # well as the az CLI. Without this the login signs in the CLI only and the script
          # stops at its first Az command with "Run Connect-AzAccount to login", which is how
          # both runs before this change failed.
          enable-AzPSSession: true

      - name: Rotate secret
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Load the pinned versions by number, so a newer copy elsewhere on the runner's module
          # path can never be the one the script uses.
          Import-Module Az.Accounts -RequiredVersion $env:AZ_ACCOUNTS_VERSION
          Import-Module Az.KeyVault -RequiredVersion $env:AZ_KEYVAULT_VERSION
          Import-Module Microsoft.Graph.Authentication -RequiredVersion $env:MG_AUTHENTICATION_VERSION
          Import-Module Microsoft.Graph.Applications -RequiredVersion $env:MG_APPLICATIONS_VERSION
          ./infra/rotate-easy-auth-secret.ps1 `
            -TenantId '${{ vars.AZURE_TENANT_ID }}' `
            -SubscriptionId '${{ vars.AZURE_SUBSCRIPTION_ID }}' `
            -ResourceGroupName '${{ vars.AZURE_RG }}' `
            -AppRegistrationDisplayName '${{ env.APP_REG_NAME }}'
