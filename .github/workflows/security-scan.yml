name: Security scan

# Secret-scans every PR, every push to main, and the full history weekly via
# gitleaks. A surprise leak (committed appsettings.json, pasted API key in a
# comment, private cert in a commit) fails the workflow so it surfaces before
# merge.
#
# This workflow used to open a public "Security review" issue on the 1st of
# each month as a reminder to re-read a detailed posture document. Both were
# retired in November 2026: periodic reviews are tracked privately now.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # weekly Monday 03:00 UTC — catch anything that slipped through PR
  workflow_dispatch:

# Read-only: nothing in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # full history so gitleaks can scan everything

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for organisations — personal
          # repos run gitleaks-action@v2 for free without a license key.
