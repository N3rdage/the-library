name: Bookshelf APK (on demand)

# Builds a Release APK of Bookshelf from the chosen branch and puts it where only
# Drew can fetch it, so a review install needs no laptop and no USB. Run it from
# the Actions tab (pick the branch) when a PR's Bookshelf change is major enough
# to want in hand before merge, or on `main` for the current build.
#
# Release, not Debug: a Debug build is marked debuggable, which lets anyone with
# the phone and a cable read the app's private data. The job fails if the APK it
# produced is debuggable.
#
# Signed with Drew's own debug keystore, in a step of its own after the build:
# the app's AAD redirect URI (msauth://com.thelibrary.mobile/<signature hash>,
# see infra/README.md) is derived from the key that signs the APK, and Android
# only installs an update over an app signed with the same key. A fresh CI key
# would mean an uninstall first and a sign-in that cannot complete. So the
# keystore comes from a secret:
#
#   BOOKSHELF_DEBUG_KEYSTORE_B64   base64 of %LOCALAPPDATA%\Xamarin\Mono for Android\debug.keystore
#
# (PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("$env:LOCALAPPDATA\Xamarin\Mono for Android\debug.keystore")) | Set-Clipboard)
#
# Order matters. The build runs the branch's own code (project files, MSBuild
# targets, package scripts), so the keystore is NOT on disk while it runs: the
# build signs with the throwaway key the SDK generates, and only afterwards is
# the real keystore restored, used by `apksigner` (an SDK tool, no project code)
# to replace that signature, and deleted. Do not move the keystore step above
# the build, and do not add a step that runs project code after it. Limits of
# this: it is still one job on one machine, so it relies on the environment's
# approval for a branch whose build would deliberately lie in wait; a second job
# would close that at the cost of a second approval.
#
# Without the secret the APK keeps the throwaway signature and the summary says
# so: it installs only after uninstalling the USB build and its sign-in will
# fail. The debug keystore's password and alias are the Android defaults
# (android / androiddebugkey); nothing else is needed.
#
# AppConfig.cs is gitignored (see AppConfig.cs.example): the tenant id, the mobile client id
# and the API scope come from three repository *secrets*, so the APK can sign in:
#
#   BOOKSHELF_TENANT_ID, BOOKSHELF_MOBILE_CLIENT_ID, BOOKSHELF_API_SCOPE
#
# They are AAD public-client facts rather than credentials (the example file says so, and
# they are compiled into any APK), but this is a public repo: a repository *variable* is
# printed unmasked in the step's `env:` block of a log anyone can read, while a secret is
# masked. Secrets keep them off the public record, matching the gitignored-file pattern.
# Without them the build uses the example's placeholders and the summary says the APK
# cannot sign in.
#
# Where the APK goes: the project's existing storage account (the covers
# account, `booktrackercovers<hash>`), a private container `bookshelf-builds`
# (no anonymous access). This is a public repo, so the run's log, summary and
# artifacts are readable by others: the workflow publishes NO link and NO
# artifact. Drew fetches the APK with his own Azure login (portal > the storage
# account > Containers > bookshelf-builds > the blob > Download); the summary
# names the blob.
#
# Who may run it, and as what (security audit 2026-11-14). The job runs in the
# GitHub Environment `bookshelf-apk`:
#   - the environment requires Drew's approval, so a run on any branch waits for
#     his click before it can read a secret or sign in to Azure. That matters
#     because this workflow is meant to run on pull-request branches, whose
#     workflow file and build scripts are unreviewed code;
#   - the keystore and the three AAD values are ENVIRONMENT secrets (same names),
#     not repository secrets, so no other workflow or branch can read them;
#   - Azure sign-in uses a separate upload-only identity
#     (infra/setup-bookshelf-apk-identity.ps1), whose only federated credential is
#     this environment and whose only role is Storage Blob Data Contributor on the
#     `bookshelf-builds` container. It is not the deploy identity and cannot touch
#     anything else in the resource group.
# The upload identity's client id and the storage account's name are read from ENVIRONMENT
# secrets BOOKSHELF_APK_CLIENT_ID and BOOKSHELF_STORAGE_ACCOUNT when they exist, so the public
# log shows them masked; the environment variables of the same names are the fallback and are
# printed in the clear. Once the secrets are set, delete the variables.

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional note for the summary (what to look at)'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  group: bookshelf-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    # Approval-gated; holds the secrets and the upload identity (see the header).
    environment: bookshelf-apk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Write AppConfig.cs from the environment secrets
        id: appconfig
        env:
          TENANT_ID: ${{ secrets.BOOKSHELF_TENANT_ID }}
          CLIENT_ID: ${{ secrets.BOOKSHELF_MOBILE_CLIENT_ID }}
          API_SCOPE: ${{ secrets.BOOKSHELF_API_SCOPE }}
        run: |
          set -euo pipefail
          cp BookTracker.Mobile/AppConfig.cs.example BookTracker.Mobile/AppConfig.cs
          if [ -n "$TENANT_ID" ] && [ -n "$CLIENT_ID" ] && [ -n "$API_SCOPE" ]; then
            sed -i \
              -e "s|REPLACE_WITH_TENANT_ID|$TENANT_ID|" \
              -e "s|REPLACE_WITH_MOBILE_CLIENT_ID|$CLIENT_ID|" \
              -e "s|api://REPLACE_WITH_AUTH_CLIENT_ID/access_as_user|$API_SCOPE|" \
              BookTracker.Mobile/AppConfig.cs
            echo "status=real" >> "$GITHUB_OUTPUT"
          else
            echo "status=placeholders" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets BOOKSHELF_TENANT_ID / BOOKSHELF_MOBILE_CLIENT_ID / BOOKSHELF_API_SCOPE are not all set; the APK is built with placeholder AAD values and cannot sign in."
          fi
          grep -c REPLACE_WITH BookTracker.Mobile/AppConfig.cs || true

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install the Android SDK components the workload wants
        run: >
          dotnet build BookTracker.Mobile/BookTracker.Mobile.csproj
          -f net10.0-android -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Build the Release APK (no real key on disk yet)
        # Runs the branch's code. The SDK signs the result with a throwaway debug key it
        # generates; the next steps replace that signature. Release so the app is not debuggable.
        run: >
          dotnet build BookTracker.Mobile/BookTracker.Mobile.csproj
          --configuration Release -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:AndroidPackageFormat=apk
          -p:UseSharedCompilation=false
          -nodeReuse:false
          /p:SourceRevisionId=${{ github.sha }}

      - name: Stop the build's helper processes
        # MSBuild worker nodes and the compiler server normally stay alive after a build (the
        # first run of this workflow ended with four of them). Nothing started by the branch's
        # build should still be running when the keystore arrives. The two switches on the build
        # ask for no long-lived helpers; this step shuts down any that started anyway and then
        # fails the job if one is still there. It narrows the gap, it does not close it: a build
        # that hid a process under another name would get past, which is why the environment's
        # approval is still the control.
        run: |
          set -uo pipefail
          dotnet build-server shutdown || true
          pkill -f 'MSBuild\.dll|VBCSCompiler|Microsoft\.Build' || true
          sleep 2
          left=$(pgrep -af 'MSBuild\.dll|VBCSCompiler|Microsoft\.Build' | grep -v pgrep || true)
          if [ -n "$left" ]; then
            echo "::error::Build helper processes are still running; refusing to go on to signing."
            echo "$left" | cut -c1-200
            exit 1
          fi
          echo "No build helper processes left."

      - name: Locate the built APK
        id: apk
        run: |
          set -euo pipefail
          apk=$(find BookTracker.Mobile/bin/Release/net10.0-android -name '*-Signed.apk' | head -n 1)
          if [ -z "$apk" ]; then echo "::error::No *-Signed.apk produced"; exit 1; fi
          branch="${GITHUB_REF_NAME//\//-}"
          name="bookshelf-${branch}-${GITHUB_SHA::7}.apk"
          # Out of the checkout, so nothing the build left behind sits beside it.
          mkdir -p "$RUNNER_TEMP/apk"
          cp "$apk" "$RUNNER_TEMP/apk/built.apk"
          echo "built=$RUNNER_TEMP/apk/built.apk" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/apk/$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Sign with Drew's keystore (SDK tools only, no project code)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.BOOKSHELF_DEBUG_KEYSTORE_B64 }}
          BUILT: ${{ steps.apk.outputs.built }}
          FINAL: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          if [ ! -x "$tools/apksigner" ]; then echo "::error::apksigner not found under $ANDROID_HOME/build-tools"; exit 1; fi

          # A Release build must not be debuggable; stop here if it is.
          # Captured first: piping straight into `grep -q` under pipefail can report a match as a failure.
          badging=$("$tools/aapt2" dump badging "$BUILT")
          if grep -q 'application-debuggable' <<<"$badging"; then
            echo "::error::The built APK is debuggable; refusing to sign it."
            exit 1
          fi

          if [ -n "$KEYSTORE_B64" ]; then
            ks="$RUNNER_TEMP/apk/signing.keystore"
            trap 'rm -f "$ks"' EXIT
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
            # Replaces the throwaway signature the build applied. The password and alias are
            # the Android debug defaults, the same on every machine; they are not secrets.
            "$tools/apksigner" sign --ks "$ks" --ks-key-alias androiddebugkey \
              --ks-pass pass:android --key-pass pass:android --out "$FINAL" "$BUILT"
            echo "status=drew" >> "$GITHUB_OUTPUT"
            echo "Signed with the laptop's debug keystore from the secret."
          else
            cp "$BUILT" "$FINAL"
            echo "status=throwaway" >> "$GITHUB_OUTPUT"
            echo "::warning::BOOKSHELF_DEBUG_KEYSTORE_B64 is not set; the APK keeps the throwaway signature (uninstall the USB build first; sign-in will not work)."
          fi
          # Checks the signature is valid; prints no certificate details (public log).
          "$tools/apksigner" verify "$FINAL"
          rm -f "$BUILT"
          ls -l "$FINAL"

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.BOOKSHELF_APK_CLIENT_ID || vars.BOOKSHELF_APK_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The upload identity holds one data role on one container and no subscription-level role.
          allow-no-subscriptions: true

      - name: Upload to the private container
        id: upload
        env:
          ACCOUNT: ${{ secrets.BOOKSHELF_STORAGE_ACCOUNT || vars.BOOKSHELF_STORAGE_ACCOUNT }}
          APK: ${{ steps.apk.outputs.path }}
          NAME: ${{ steps.apk.outputs.name }}
        run: |
          set -euo pipefail
          if [ -z "$ACCOUNT" ]; then echo "::error::BOOKSHELF_STORAGE_ACCOUNT is not set (environment secret, or the older environment variable)"; exit 1; fi
          container=bookshelf-builds
          # Data-plane calls as the signed-in identity (no account key). The container is
          # declared in infra/modules/cover-storage.bicep; this identity cannot create it.
          az storage blob upload --account-name "$ACCOUNT" --container-name "$container" \
            --name "$NAME" --file "$APK" --content-type application/vnd.android.package-archive \
            --overwrite --auth-mode login --output none
          # Keep old builds from piling up: anything older than 14 days goes. Each blob is
          # compared here and only the old ones are deleted, so the log says how many were
          # kept and removed instead of a "condition not met" warning for every recent build.
          # A failed list or delete is a warning, never a failed run: the APK is already uploaded.
          cutoff=$(date -u -d '-14 days' +%s)
          listing=$(az storage blob list --account-name "$ACCOUNT" --container-name "$container" \
            --auth-mode login --query "[].[name, properties.lastModified]" --output tsv) \
            || { echo "::warning::Could not list the container, so no old builds were pruned."; listing=""; }
          kept=0; removed=0; failed=0
          while IFS=$'\t' read -r blob modified; do
            [ -n "$blob" ] || continue
            if [ "$(date -u -d "$modified" +%s)" -lt "$cutoff" ]; then
              if az storage blob delete --account-name "$ACCOUNT" --container-name "$container" \
                  --name "$blob" --auth-mode login --output none 2>/dev/null; then
                removed=$((removed + 1))
              else
                failed=$((failed + 1))
              fi
            else
              kept=$((kept + 1))
            fi
          done <<< "$listing"
          echo "Builds in the container: kept $kept, removed $removed (older than 14 days)."
          if [ "$failed" -gt 0 ]; then
            echo "::warning::$failed old build(s) could not be removed; the next run tries again."
          fi

      - name: Summary
        env:
          KEYSTORE: ${{ steps.keystore.outputs.status }}
          APPCONFIG: ${{ steps.appconfig.outputs.status }}
          NAME: ${{ steps.apk.outputs.name }}
          NOTE: ${{ inputs.note }}
        run: |
          {
            echo "## Bookshelf APK: \`$NAME\`"
            echo
            echo "- Branch \`$GITHUB_REF_NAME\` at \`${GITHUB_SHA::7}\`"
            if [ "$KEYSTORE" = "drew" ]; then
              echo "- Release build, not debuggable, signed with the laptop's debug keystore: installs over the USB build, sign-in works."
            else
              echo "- **Signed with a throwaway key** (secret \`BOOKSHELF_DEBUG_KEYSTORE_B64\` missing): uninstall the USB build first, and sign-in will not complete."
            fi
            if [ "$APPCONFIG" != "real" ]; then
              echo "- **AAD values are placeholders** (repository secrets \`BOOKSHELF_TENANT_ID\`, \`BOOKSHELF_MOBILE_CLIENT_ID\`, \`BOOKSHELF_API_SCOPE\` missing): the app cannot sign in."
            fi
            [ -n "$NOTE" ] && echo "- Note: $NOTE"
            echo
            echo "**Where it is:** the covers storage account, private container \`bookshelf-builds\`, blob \`$NAME\`."
            echo
            echo "No link is published (public repo). On the phone: portal.azure.com, sign in, open the storage account, Containers, bookshelf-builds, tap the blob, Download, then open the download and allow installs from the browser if asked. Builds older than 14 days are pruned."
          } >> "$GITHUB_STEP_SUMMARY"
