name: Swap staging to production

# The `production` GitHub Environment (Settings -> Environments) gates this
# job: 2-minute wait timer (cancellable window for fat-finger dispatches) and
# Deployment branches restricted to `main`. Required-reviewer approval is a
# future step, blocked on having a collaborator (TODO.md #22).
on:
  workflow_dispatch:

# Read-only by default. Only the swap job below may request an OIDC token for Azure.
permissions:
  contents: read

# Shared with deploy.yml: both open a temporary SQL firewall rule and restore the server's
# public-network-access setting afterwards. If the two overlapped, the second would record
# "Enabled" as the state to restore and leave the server public for good.
concurrency:
  group: sql-firewall-window
  cancel-in-progress: false

# Two jobs on purpose, as in deploy.yml. `package` restores and compiles, and with that runs
# every MSBuild target, source generator and NuGet build script the solution pulls in; it has no
# `id-token` permission and is outside the `production` environment, so nothing that runs there
# can sign in to Azure. `swap` holds the production identity and compiles nothing: it downloads
# the migration bundle `package` produced and runs only that and the Azure steps. Keep it that
# way: no `dotnet build`, `restore` or `publish` may be added to `swap`. The environment's wait
# timer starts when `swap` is reached, after `package` has finished.
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Install dotnet-ef
        # Required for `dotnet ef migrations bundle` below. Fresh GH
        # runners don't have it preinstalled. Pinned to 10.0.7 to match
        # the .NET runtime version.
        run: dotnet tool install --global dotnet-ef --version 10.0.7

      - name: Restore
        run: dotnet restore BookTracker.slnx

      - name: Build migration bundle
        # Same bundle the deploy.yml workflow built against staging DB,
        # rebuilt here from the commit on `main` this run was started on.
        # Applies pending migrations against the connection string the
        # bundle is invoked with. See TODO #21.
        run: |
          dotnet ef migrations bundle \
            --project BookTracker.Data \
            --startup-project BookTracker.Web \
            --configuration Release \
            --self-contained \
            -r linux-x64 \
            --output ./migrate \
            --force

      - name: Hand the migration bundle to the swap job
        # Compiled from public source, with no secrets in it. One day is ample: the swap job
        # reads it minutes later.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prod-migrate
          path: migrate
          if-no-files-found: error
          retention-days: 1

  swap:
    needs: package
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Fetch the migration bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prod-migrate

      - name: Azure login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve SQL server + open temp firewall
        id: sql-fw
        env:
          AZURE_RG: ${{ vars.AZURE_RG }}
        run: |
          set -euo pipefail
          SQL_SERVER=$(az sql server list \
            --resource-group "$AZURE_RG" \
            --query "[?starts_with(name, 'booktracker-sql-')].name | [0]" -o tsv)
          if [ -z "$SQL_SERVER" ]; then
            echo "::error::No SQL server matching booktracker-sql-* in $AZURE_RG"
            exit 1
          fi
          echo "sql_server=$SQL_SERVER" >> "$GITHUB_OUTPUT"
          echo "sql_fqdn=$SQL_SERVER.database.windows.net" >> "$GITHUB_OUTPUT"

          PUBLIC_ACCESS_WAS=$(az sql server show \
            --resource-group "$AZURE_RG" --name "$SQL_SERVER" \
            --query "publicNetworkAccess" -o tsv)
          echo "public_access_was=$PUBLIC_ACCESS_WAS" >> "$GITHUB_OUTPUT"

          if [ "$PUBLIC_ACCESS_WAS" != "Enabled" ]; then
            az sql server update \
              --resource-group "$AZURE_RG" --name "$SQL_SERVER" \
              --set publicNetworkAccess=Enabled --output none
          fi

          MY_IP=$(curl -fsSL https://api.ipify.org)
          RULE_NAME="ghactions-swap-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "rule_name=$RULE_NAME" >> "$GITHUB_OUTPUT"
          az sql server firewall-rule create \
            --resource-group "$AZURE_RG" --server "$SQL_SERVER" \
            --name "$RULE_NAME" \
            --start-ip-address "$MY_IP" --end-ip-address "$MY_IP" \
            --output none
          sleep 10

      - name: Apply migrations to prod DB
        # If this step fails, the swap below does NOT run — prod stays on
        # both old code AND old schema (clean abort, no partial state).
        env:
          PROD_CONN: Server=tcp:${{ steps.sql-fw.outputs.sql_fqdn }},1433;Database=booktracker;Authentication=Active Directory Default;Encrypt=True;TrustServerCertificate=False;
        run: |
          chmod +x ./migrate
          ./migrate --connection "$PROD_CONN"

      - name: Close temp firewall
        if: always() && steps.sql-fw.outputs.rule_name != ''
        env:
          AZURE_RG: ${{ vars.AZURE_RG }}
          SQL_SERVER: ${{ steps.sql-fw.outputs.sql_server }}
          RULE_NAME: ${{ steps.sql-fw.outputs.rule_name }}
          PUBLIC_ACCESS_WAS: ${{ steps.sql-fw.outputs.public_access_was }}
        run: |
          az sql server firewall-rule delete \
            --resource-group "$AZURE_RG" --server "$SQL_SERVER" \
            --name "$RULE_NAME" --output none || true
          if [ "$PUBLIC_ACCESS_WAS" != "Enabled" ]; then
            az sql server update \
              --resource-group "$AZURE_RG" --name "$SQL_SERVER" \
              --set publicNetworkAccess="$PUBLIC_ACCESS_WAS" \
              --output none || true
          fi

      - name: Swap staging into production
        run: |
          az webapp deployment slot swap \
            --resource-group "${{ vars.AZURE_RG }}" \
            --name "${{ vars.AZURE_APP_NAME }}" \
            --slot "${{ vars.AZURE_SLOT_NAME }}" \
            --target-slot production
