version: 2

updates:
  # GitHub Actions. Workflows pin actions to commit SHAs (a tag can be moved to other code,
  # and the deploy and rotation jobs run it while signed in to Azure); Dependabot proposes
  # the SHA bumps and keeps the `# vN` comment beside each one current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

  # NuGet packages (C#). The root directory follows BookTracker.slnx;
  # BookTracker.Mobile is outside the solution on purpose (see the comment
  # in the .slnx), so it is listed on its own or Dependabot never sees it.
  - package-ecosystem: "nuget"
    directories:
      - "/"
      - "/BookTracker.Mobile"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      ef-core:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
      # SkiaSharp 3.x splits the platform native assets into separate
      # NuGet packages (SkiaSharp + SkiaSharp.NativeAssets.Linux /
      # .Win32 / .macOS). Their versions ship in lockstep — the main
      # package's transitive resolution requires the NativeAssets to
      # match exactly, or the test runner can't load native libs.
      # Without this grouping, Dependabot opens one PR per package
      # and merging only some of them leaves the build broken
      # (encountered 2026-05-26 on the 3.119.2 → 3.119.4 bump). Group
      # all of them into a single PR so version mismatches are
      # impossible by construction.
      skiasharp:
        patterns:
          - "SkiaSharp*"
    ignore:
      # Microsoft.ApplicationInsights.AspNetCore 3.x is a full OpenTelemetry
      # rewrite of the classic SDK — ITelemetryInitializer (currently used
      # by UserTelemetryInitializer.cs) is gone; migration to BaseProcessor
      # <Activity> + IHttpContextAccessor is non-trivial. Tracked in TODO
      # #42; ignore the major bump until then so Dependabot doesn't keep
      # re-opening the failing PR. Minor / patch updates within 2.x stay
      # auto-applied.
      - dependency-name: "Microsoft.ApplicationInsights.AspNetCore"
        update-types: ["version-update:semver-major"]

  # npm packages (vendored JS libraries like html5-qrcode)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
