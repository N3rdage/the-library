version: 2

updates:
  # GitHub Actions. Workflows pin actions to commit SHAs (a tag can be moved to other code,
  # and the deploy and rotation jobs run it while signed in to Azure); Dependabot proposes
  # the SHA bumps and keeps the `# vN` comment beside each one current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

  # NuGet packages (C#). The root directory follows BookTracker.slnx;
  # BookTracker.Mobile is outside the solution on purpose (see the comment
  # in the .slnx), so it is listed on its own or Dependabot never sees it.
  - package-ecosystem: "nuget"
    directories:
      - "/"
      - "/BookTracker.Mobile"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      ef-core:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
      # SkiaSharp 3.x splits the platform native assets into separate
      # NuGet packages (SkiaSharp + SkiaSharp.NativeAssets.Linux /
      # .Win32 / .macOS). Their versions ship in lockstep — the main
      # package's transitive resolution requires the NativeAssets to
      # match exactly, or the test runner can't load native libs.
      # Without this grouping, Dependabot opens one PR per package
      # and merging only some of them leaves the build broken
      # (encountered 2026-05-26 on the 3.119.2 → 3.119.4 bump). Group
      # all of them into a single PR so version mismatches are
      # impossible by construction.
      skiasharp:
        patterns:
          - "SkiaSharp*"
    ignore:
      # Both apps target net10.0, and the Microsoft.Extensions.* /
      # Microsoft.AspNetCore.* (Mvc.Testing in the test projects) / EF Core /
      # System.Security.Cryptography.Pkcs packages ride the runtime's line:
      # their 11.x majors belong to .NET 11, and taking one ahead of the
      # runtime leaves a mixed graph where every later 10.x bump fails with
      # NU1605 downgrade errors. Interim rule, tracked in TODO #58 (the .NET 11
      # upgrade of both apps and the MAUI workload); lifting it is part of
      # that row. Minor / patch updates within 10.x stay auto-applied.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Security.Cryptography.Pkcs"
        update-types: ["version-update:semver-major"]

  # npm packages (vendored JS libraries like html5-qrcode)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
